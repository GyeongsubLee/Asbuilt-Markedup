name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Test
        run: python tests/test_samples.py

      - name: Build ISO_QC.exe
        run: >
          python -m PyInstaller --noconfirm --onefile --console --name ISO_QC
          --exclude-module pymupdf.layout --exclude-module pymupdf4llm --exclude-module pymupdf_layout
          --exclude-module onnxruntime --exclude-module tkinter
          iso_qc.py

      - name: Smoke test the exe on sample data
        shell: pwsh
        run: |
          python tests/make_samples.py smoke
          Copy-Item dist/ISO_QC.exe smoke/
          Push-Location smoke
          ./ISO_QC.exe --no-pause --workers 2
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Get-ChildItem QC_REPORT_*/ISO_QC_Report.xlsx)) { exit 1 }
          $log = Get-Content (Get-ChildItem QC_REPORT_*/errors.log) -Raw
          if ($log) { Write-Output $log; Write-Error "exe reported errors"; exit 1 }
          Pop-Location

      - uses: actions/upload-artifact@v4
        with:
          name: ISO_QC
          path: |
            dist/ISO_QC.exe
            README.md

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ISO_QC.exe
